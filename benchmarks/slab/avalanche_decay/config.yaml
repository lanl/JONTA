# McDevitt et al. 2019 Appendix B3 slab avalanche growth-rate case.
# Run with the benchmark driver after selecting the desired resolution.
model:
  geometry: slab
  precision: float64
execution:
  mode: serial
  platform: cpu
geometry:
  n_radial: 2
  minor_radius_cm: 100.0
  epsilon: 0.0
  c_tau_over_a: 1.0
  a_omega_ce_over_c: 1.0
field:
  e_over_ec: 3.2321
background:
  ne_cm3: 1.0e14
  te_ev: 1.0e3
  ti_ev: 1.0e3
  zeff: 1.0
  coulomb_log: 15.0
particles:
  markers: 4096
  total_weight: 1.0
  seed: 3
  gamma_range: [10.0, 20.0]
  xi_range: [-1.0, -0.8]
  radius_range: [0.0, 0.0]
timesteps:
  dt_particle: 1.0e-3
  large_angle_every: 0
  coupling_every: 1
  diagnostics_every: 1
collisions:
  small_angle:
    pitch_scattering: true
    friction: true
    energy_scattering: true
    max_nu_dt: 0.5
  large_angle:
    enabled: false
population:
  capacity: 4096
  thinning: stratified
  overflow_only: true
  thinning_frequency: 1
diagnostics:
  fit_start_fraction: 0.35
  bins: 320
  sample_every: 1
benchmark:
  name: mcdevitt-2019-b3-slab
  reference: reference/mcdevitt_2019_figB4.csv
  description: Uniform slab avalanche growth rate at E/Ec = 3.2321.
  replicas: 8
reference:
  data_file: reference/mcdevitt_2019_figB4.csv
  comparison: growth_rate
  growth_rate_sem: 0.0
  r2_min: 0.95
output:
  directory: ../../../benchmark_results/mcdevitt_b3
  formats: [json, csv, png]
  save_histories: true
  save_final_state: false
