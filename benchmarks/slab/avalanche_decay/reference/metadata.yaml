benchmark: slab.avalanche_decay
status: reference_data_available
sources:
  - key: mcdevitt_2019_avalanche
    citation: "C. J. McDevitt, Z. Guo, and X.-Z. Tang, PPCF 61, 054008 (2019)"
    source_document: McDevitt_2019_PPCF_Avalanche.pdf
    source_url: https://doi.org/10.1088/1361-6587/ab0d6d
    figures: [13, 14, B3, B4]
    comparison_targets: [avalanche_growth_rate, avalanche_threshold, cutoff_invariance]
internal_provenance:
  - description: >-
      The legacy RAMc implementation is retained as an internal model
      cross-check only. It is not a published source and is not an external
      comparison target for this benchmark.
    internal_source_document: RAMc-doc.pdf
reference_data:
  - file: mcdevitt_2019_figB3_B13.csv
    provenance: manual digitization of Fig. B3(a) and Fig. 13
    uncertainty: >-
      Approximate marker-center digitization uncertainty; about 0.01 in E/Ec
      and 0.001 in gamma_av*tau_c for the rasterized source figure. Values are
      comparison data, not exact machine-readable source values.
  - file: mcdevitt_2019_figB4.csv
    provenance: manual digitization of Appendix Fig. B4(a,b)
    uncertainty: plot-digitization uncertainty
