[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jonta"
version = "0.1.0"
description = "JAX-based GPU-accelerated kinetic Monte Carlo code for runaway electrons"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "matplotlib>=3.8",
    "build>=1.2",
]
metal = [
    "jax-metal>=0.1.1; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["simulation"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "boundaries*",
    "collisions*",
    "core*",
    "coupling*",
    "deposition*",
    "diagnostics*",
    "fields*",
    "integrators*",
    "orbits*",
    "parallel*",
    "plasma*",
    "population*",
    "resampling*",
    "sources*",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
